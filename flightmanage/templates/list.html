{% extends 'base.html' %}
{% block content %}
<h2> All Products</h2>
<table border = "1">
    <tr>
        <th>Product Name</th>
        <th>Product ID</th>
        <th>quantity</th>
        <th>supplier Name</th>
        <th>price</th>
        <th>category</th>
    </tr>

    {% for f in flightmanage %}
    <tr>
        <td>{{ f.product_name }}</td>
        <td>{{ f.product_id }}</td>
        <td>{{ f.quantity }}</td>
        <td>{{ f.supplier_name }}</td>
        <td>{{ f.price }}</td>
        <td>
            <a href = "{% url 'edit' f.product_id %}">Edit</a>
             <a href = "{% url 'delete' f.product_id %}">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
